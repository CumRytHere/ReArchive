name: ci

on:
  push:
    branches: [main, "inc/**", "kit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The three declared environments of D-013. ubuntu-24.04-arm is available to private
        # repositories since 2026-01-29 (github.blog changelog, 2026-01-29).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/protected_paths.py compares with main
      - name: Make main available as the protected-paths baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true
      - uses: astral-sh/setup-uv@v6
      - name: Install the pinned Python from .python-version
        run: uv python install
      - name: Verify (unit, contract, tools, lint, types, protected paths)
        env:
          # main itself may change protected paths (owner commits); every other ref is compared with main.
          REARCHIVE_PROTECTED_BASE: ${{ github.ref == 'refs/heads/main' && 'HEAD' || 'origin/main' }}
        run: python3 tools/verify.py --fast
      - name: Acceptance gate
        # Red until Gate A. The owner sets repository variable ACCEPTANCE_REQUIRED=true at Gate A.
        continue-on-error: ${{ vars.ACCEPTANCE_REQUIRED != 'true' }}
        run: uv run --no-sync pytest -q -m acceptance -p no:cacheprovider
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.os }}
          path: reports/verify/
          if-no-files-found: warn

  kaitai:
    name: generated parsers match their .ksy sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate and diff
        run: |
          if ! ls specs/*/*.ksy >/dev/null 2>&1; then echo "no .ksy specs yet"; exit 0; fi
          npm ci --prefix tools/ksc --silent
          tools/ksc/regen.sh
          if [ -n "$(git status --porcelain -- src/rearchive/generated/)" ]; then
            git status --porcelain -- src/rearchive/generated/
            echo "::error::src/rearchive/generated/ is stale or incomplete: run tools/ksc/regen.sh and commit"; exit 1
          fi

  protected-paths:
    name: protected paths unchanged by this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with the base branch
        # Informational for owner PRs that intentionally change protected paths: label them owner-protected.
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'owner-protected') }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/protected_paths.py check --base "origin/${{ github.base_ref }}"
